name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Ensure opencode branch objects are present
        run: |
          set -euxo pipefail
          # O OpenCode faz `git checkout opencode` e às vezes o runner não tem todos os objects/tree necessários.
          # Fazendo fetch explícito do branch (com histórico completo) antes disso, evitamos o `fatal: unable to read tree`.
          git fetch --no-tags origin opencode --depth=0
          git branch -f opencode origin/opencode

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/openrouter/auto
